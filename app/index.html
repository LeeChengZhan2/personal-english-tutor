<title>Blue Pencil</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,500..800&display=swap">
<style>
/* Blue Pencil: a copy editor's desk. Cool paper and ink; corrections in blue pencil; deletions struck through in red.
   Layout: one reading column of sections; tabs at the bottom on phones and at the top from 900px. */
:root {
  --paper: #f4f6f9;
  --surface: #ffffff;
  --sunk: #eceff4;
  --ink: #14171d;
  --muted: #586070;
  --faint: #8a92a0;
  --line: #dde2ea;
  --pencil: #2b58cf;
  --pencil-ink: #ffffff;
  --pencil-soft: #e5ebfa;
  --pencil-line: #b6c7f1;
  --mark: #c0362c;
  --mark-soft: #fbe7e4;
  --ok: #17774a;
  --ok-soft: #dff2e7;
  --amber: #9a5d00;
  --amber-soft: #fbefd9;
  --shadow: rgba(18, 27, 46, 0.08);
  --scrim: rgba(10, 14, 22, 0.42);
  --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, sans-serif;
  --font-mono: ui-monospace, "Cascadia Mono", Consolas, monospace;
  --radius: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #101318; --surface: #181c23; --sunk: #1f242d; --ink: #e8ebf1; --muted: #a2a9b6; --faint: #6f7786; --line: #2a303b;
    --pencil: #8eadff; --pencil-ink: #0d1530; --pencil-soft: #1c2741; --pencil-line: #34487a;
    --mark: #ff8a7d; --mark-soft: #3a1d1a; --ok: #63d49c; --ok-soft: #14301f; --amber: #f0b45a; --amber-soft: #33270f;
    --shadow: rgba(0, 0, 0, 0.35); --scrim: rgba(0, 0, 0, 0.6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #101318; --surface: #181c23; --sunk: #1f242d; --ink: #e8ebf1; --muted: #a2a9b6; --faint: #6f7786; --line: #2a303b;
  --pencil: #8eadff; --pencil-ink: #0d1530; --pencil-soft: #1c2741; --pencil-line: #34487a;
  --mark: #ff8a7d; --mark-soft: #3a1d1a; --ok: #63d49c; --ok-soft: #14301f; --amber: #f0b45a; --amber-soft: #33270f;
  --shadow: rgba(0, 0, 0, 0.35); --scrim: rgba(0, 0, 0, 0.6);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--pencil); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--font-display); line-height: 1.12; margin: 0; text-wrap: balance; letter-spacing: -0.01em; }
p { margin: 0; }
.ic { width: 20px; height: 20px; flex: none; }

/* ---------- shell ---------- */
.app { min-height: 100%; padding-bottom: calc(76px + env(safe-area-inset-bottom, 0px)); }
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; display: flex; align-items: center; gap: 12px; padding: 10px 16px; background: var(--paper); border-bottom: 1px solid var(--line); }
.brand { display: inline-flex; align-items: center; gap: 8px; color: var(--ink); text-decoration: none; font-family: var(--font-display); font-weight: 800; font-size: 19px; letter-spacing: -0.02em; }
.brand .ic { color: var(--pencil); width: 22px; height: 22px; }
.bar-meta { margin-left: auto; display: flex; align-items: center; gap: 10px; font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
.bar-meta .streak { display: inline-flex; align-items: center; gap: 4px; color: var(--amber); font-weight: 700; }
.bar-meta .streak .ic { width: 17px; height: 17px; }
.icon-btn { display: inline-grid; place-items: center; width: 38px; height: 38px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--muted); }
.icon-btn:hover { color: var(--ink); }
.tabs { position: fixed; z-index: 20; left: 0; right: 0; bottom: 0; display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); padding: 6px 4px calc(6px + env(safe-area-inset-bottom, 0px)); background: var(--surface); border-top: 1px solid var(--line); }
.tabs a { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 1px; border-radius: 10px; color: var(--muted); text-decoration: none; font-size: 11.5px; font-weight: 700; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tabs a[aria-current="page"] { color: var(--pencil); background: var(--pencil-soft); }
.notice { margin: 12px 16px 0; padding: 10px 14px; border-radius: 10px; background: var(--amber-soft); color: var(--ink); font-size: 14px; }
.view { display: block; max-width: 760px; margin: 0 auto; padding: 20px 16px 32px; }
.view:focus { outline: none; }
@media (min-width: 900px) {
  .app { padding-bottom: 0; }
  .bar { padding: 12px 24px; }
  .tabs { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 61px); bottom: auto; display: flex; justify-content: center; gap: 4px; padding: 8px 24px; border-top: 0; border-bottom: 1px solid var(--line); background: var(--paper); }
  .tabs a { flex-direction: row; gap: 8px; padding: 8px 14px; font-size: 14px; }
  .view { padding: 32px 24px 64px; }
}

/* ---------- type and layout ---------- */
.stack { display: grid; gap: 28px; }
.stack-sm { display: grid; gap: 12px; }
.eyebrow { font-size: 12px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
.display { font-size: clamp(30px, 7vw, 44px); font-weight: 800; letter-spacing: -0.025em; }
.title { font-size: 22px; font-weight: 700; }
.sub { font-size: 17px; font-weight: 700; font-family: var(--font-display); }
.lede { font-size: 17px; color: var(--muted); max-width: 60ch; }
.muted { color: var(--muted); }
.small { font-size: 14px; }
.row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
.spread { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding-bottom: 8px; border-bottom: 2px solid var(--ink); }
.section-head a, .link { color: var(--pencil); font-weight: 700; text-decoration: none; font-size: 14px; background: none; border: 0; padding: 0; }
.panel { padding: 18px; border-radius: var(--radius); background: var(--surface); border: 1px solid var(--line); box-shadow: 0 1px 2px var(--shadow); }
.list { display: grid; }
.list > * { padding: 14px 0; border-bottom: 1px solid var(--line); }
.list > *:last-child { border-bottom: 0; }
.num { font-variant-numeric: tabular-nums; }

/* ---------- buttons ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 10px 18px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font-weight: 700; text-decoration: none; }
.btn:hover { border-color: var(--pencil-line); }
.btn.primary { background: var(--pencil); border-color: var(--pencil); color: var(--pencil-ink); }
.btn.primary:hover { filter: brightness(1.06); }
.btn.big { min-height: 54px; padding: 14px 24px; font-size: 18px; border-radius: 14px; }
.btn.quiet { background: transparent; border-color: transparent; color: var(--pencil); padding-inline: 8px; }
.btn[disabled] { opacity: 0.45; cursor: default; filter: none; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 5px 11px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); font-size: 14px; font-weight: 700; color: var(--muted); }
.chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--paper); }
.pill { display: inline-flex; align-items: baseline; gap: 6px; padding: 6px 12px; border-radius: 999px; background: var(--sunk); font-size: 14px; color: var(--muted); }
.pill b { color: var(--ink); font-size: 16px; font-variant-numeric: tabular-nums; }
.tag { display: inline-block; padding: 1px 8px; border-radius: 6px; font-size: 12px; font-weight: 700; letter-spacing: 0.02em; background: var(--sunk); color: var(--muted); }
.tag.error { background: var(--mark-soft); color: var(--mark); }
.tag.unnatural { background: var(--amber-soft); color: var(--amber); }
.tag.typo, .tag.style { background: var(--sunk); color: var(--muted); }

/* ---------- proofreading marks ---------- */
del.x { color: var(--mark); text-decoration: line-through; text-decoration-thickness: 2px; text-decoration-color: var(--mark); background: var(--mark-soft); border-radius: 3px; padding: 0 2px; }
ins.x { color: var(--pencil); text-decoration: none; background: var(--pencil-soft); border-radius: 3px; padding: 0 2px; font-weight: 700; }
ins.x::before { content: ""; display: inline-block; width: 0; height: 0; margin-right: 3px; border-left: 4px solid transparent; border-right: 4px solid transparent; border-bottom: 7px solid var(--pencil); vertical-align: -1px; }
.proof { font-size: 17px; line-height: 1.65; overflow-wrap: anywhere; }
.quote { padding-left: 14px; border-left: 3px solid var(--line); color: var(--muted); overflow-wrap: anywhere; }
.blank { display: inline-block; min-width: 4.5em; border-bottom: 2.5px solid var(--pencil); color: transparent; }

/* ---------- today ---------- */
.hero { display: grid; gap: 14px; padding-top: 6px; }
.hero .row { margin-top: 6px; }
.focus { display: grid; gap: 10px; padding: 18px; border-radius: var(--radius); background: var(--pencil-soft); border: 1px solid var(--pencil-line); }
.focus .rule { font-size: 17px; }
.example-pair { display: grid; gap: 4px; font-size: 16px; }
.example-pair .w { color: var(--mark); text-decoration: line-through; text-decoration-thickness: 2px; }
.example-pair .r { color: var(--ok); font-weight: 700; }

/* ---------- patterns ---------- */
.cat { display: grid; gap: 6px; }
.cat h2 { font-size: 20px; }
.pattern-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 14px; align-items: center; padding: 14px 4px; border-bottom: 1px solid var(--line); background: none; border-left: 0; border-right: 0; border-top: 0; text-align: left; width: 100%; color: var(--ink); }
.pattern-row:hover { background: var(--surface); }
.pattern-row .name { font-weight: 700; font-size: 17px; }
.pattern-row .meta { grid-column: 1; font-size: 14px; color: var(--muted); }
.pattern-row .bar-wrap { grid-row: 1 / span 2; grid-column: 2; display: grid; gap: 4px; justify-items: end; font-size: 13px; color: var(--muted); }
.mastery { width: 96px; height: 8px; border-radius: 99px; background: var(--sunk); overflow: hidden; display: flex; }
.mastery span { display: block; height: 100%; }
.mastery .m { background: var(--ok); }
.mastery .l { background: var(--pencil-line); }
.card-row { display: grid; gap: 6px; }

/* ---------- messages ---------- */
.msg { display: grid; gap: 10px; }
.msg .head { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-size: 14px; color: var(--muted); }
.msg .body { font-size: 16px; line-height: 1.6; white-space: pre-wrap; overflow-wrap: anywhere; }
.msg .body.clamp { display: -webkit-box; -webkit-line-clamp: 6; -webkit-box-orient: vertical; overflow: hidden; }
.msg .polished { padding: 12px 14px; border-radius: 12px; background: var(--ok-soft); white-space: pre-wrap; overflow-wrap: anywhere; }
.seg { display: inline-flex; padding: 3px; border-radius: 10px; background: var(--sunk); }
.seg button { border: 0; background: transparent; padding: 5px 12px; border-radius: 8px; font-size: 14px; font-weight: 700; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px var(--shadow); }

/* ---------- write ---------- */
textarea.field { width: 100%; min-height: 150px; padding: 14px 16px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); font-size: 17px; line-height: 1.55; resize: vertical; }
textarea.field:focus { outline: 2px solid var(--pencil); border-color: var(--pencil); }
.finding { display: grid; gap: 6px; padding: 14px 0; border-bottom: 1px solid var(--line); }
.finding:last-child { border-bottom: 0; }

/* ---------- progress ---------- */
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; }
.kpi { padding: 14px 16px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); }
.kpi b { display: block; font-family: var(--font-display); font-size: 30px; font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
.kpi span { font-size: 14px; color: var(--muted); }
.chart { width: 100%; height: auto; display: block; overflow: visible; }
.chart text { fill: var(--muted); font-family: var(--font-body); font-size: 12px; }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.chart .line { fill: none; stroke: var(--pencil); stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round; }
.chart .area { fill: var(--pencil-soft); }
.chart .dot { fill: var(--surface); stroke: var(--pencil); stroke-width: 2.5; }
.chart .end { fill: var(--pencil); }
.chart .bar-a { fill: var(--pencil-line); }
.chart .bar-c { fill: var(--pencil); }
.legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 13px; color: var(--muted); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
.catbar { display: grid; grid-template-columns: minmax(0, 150px) minmax(0, 1fr) auto; gap: 10px; align-items: center; font-size: 14px; }
.catbar .track { height: 12px; border-radius: 99px; background: var(--sunk); overflow: hidden; display: flex; }
.catbar .track span { height: 100%; }
.catbar .track .m { background: var(--ok); }
.catbar .track .l { background: var(--pencil-line); }
.table-wrap { overflow-x: auto; }
table.plain { width: 100%; border-collapse: collapse; font-size: 15px; }
table.plain th { text-align: left; font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); padding: 8px 10px 8px 0; border-bottom: 1px solid var(--line); }
table.plain td { padding: 10px 10px 10px 0; border-bottom: 1px solid var(--line); vertical-align: top; }

/* ---------- practice ---------- */
.practice { position: fixed; inset: 0; z-index: 50; display: flex; flex-direction: column; background: var(--paper); padding: env(safe-area-inset-top, 0px) 0 env(safe-area-inset-bottom, 0px); }
.p-top { display: flex; align-items: center; gap: 12px; padding: 12px 16px; }
.p-progress { flex: 1; height: 8px; border-radius: 99px; background: var(--sunk); overflow: hidden; }
.p-progress span { display: block; height: 100%; background: var(--pencil); border-radius: 99px; transition: width 0.25s ease; }
.p-count { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; min-width: 3.5em; text-align: right; }
.p-scroll { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; }
.p-body { max-width: 680px; margin: 0 auto; padding: 8px 16px 24px; display: grid; gap: 18px; }
.p-kind { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--pencil); }
.p-prompt { font-size: 22px; font-weight: 700; font-family: var(--font-display); }
.p-sentence { font-size: 21px; line-height: 1.6; overflow-wrap: anywhere; }
.options { display: grid; gap: 10px; }
.option { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 56px; padding: 12px 16px; border-radius: 14px; border: 2px solid var(--line); background: var(--surface); text-align: left; font-size: 18px; }
.option .key { flex: none; display: inline-grid; place-items: center; width: 26px; height: 26px; border-radius: 7px; background: var(--sunk); color: var(--muted); font-size: 13px; font-weight: 700; }
.option:hover:not([disabled]) { border-color: var(--pencil-line); }
.option.right { border-color: var(--ok); background: var(--ok-soft); }
.option.wrong { border-color: var(--mark); background: var(--mark-soft); }
.option[disabled] { cursor: default; }
.words { display: flex; flex-wrap: wrap; gap: 8px; }
.word { padding: 8px 12px; border-radius: 10px; border: 2px solid var(--line); background: var(--surface); font-size: 19px; }
.word:hover:not([disabled]) { border-color: var(--pencil-line); }
.word.target { border-color: var(--ok); background: var(--ok-soft); }
.word.missed { border-color: var(--mark); background: var(--mark-soft); }
.word[disabled] { cursor: default; }
.answer { width: 100%; min-height: 110px; padding: 14px 16px; border-radius: 14px; border: 2px solid var(--line); background: var(--surface); font-size: 19px; line-height: 1.5; resize: vertical; }
.answer:focus { outline: none; border-color: var(--pencil); }
.feedback { display: grid; gap: 10px; padding: 16px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); }
.feedback.good { border-color: var(--ok); }
.feedback.bad { border-color: var(--mark); }
.verdict { display: flex; align-items: center; gap: 8px; font-family: var(--font-display); font-size: 20px; font-weight: 800; }
.feedback.good .verdict { color: var(--ok); }
.feedback.bad .verdict { color: var(--mark); }
.zh { color: var(--muted); font-size: 15px; }
.p-foot { position: sticky; bottom: 0; display: flex; justify-content: flex-end; gap: 10px; padding: 12px 16px; background: var(--paper); border-top: 1px solid var(--line); }
.p-foot .inner { width: 100%; max-width: 680px; margin: 0 auto; display: flex; gap: 10px; justify-content: flex-end; }
.lesson { display: grid; gap: 12px; }
.lesson .rule { font-size: 19px; line-height: 1.55; }
.done-score { font-family: var(--font-display); font-size: 64px; font-weight: 800; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; }

/* ---------- sheet ---------- */
.sheet { position: fixed; inset: 0; z-index: 60; display: grid; align-items: end; justify-items: center; background: var(--scrim); }
.sheet-card { width: 100%; max-width: 560px; max-height: 90vh; overflow-y: auto; padding: 20px 18px calc(20px + env(safe-area-inset-bottom, 0px)); border-radius: 18px 18px 0 0; background: var(--surface); display: grid; gap: 16px; }
@media (min-width: 640px) { .sheet { align-items: center; } .sheet-card { border-radius: 18px; } }
.setting { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.setting:last-of-type { border-bottom: 0; }
.setting label { display: grid; gap: 2px; }
.setting small { color: var(--muted); font-size: 13px; }
.switch { appearance: none; width: 46px; height: 28px; border-radius: 99px; background: var(--sunk); border: 1px solid var(--line); position: relative; flex: none; cursor: pointer; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: var(--faint); transition: transform 0.15s ease; }
.switch:checked { background: var(--pencil); border-color: var(--pencil); }
.switch:checked::after { transform: translateX(18px); background: var(--pencil-ink); }
select.pick { padding: 8px 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); }

/* ---------- words ---------- */
.word-row { display: grid; gap: 6px; }
.word-row .top { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 10px; }
.word-row .lemma { font-family: var(--font-display); font-size: 22px; font-weight: 800; letter-spacing: -0.01em; }
.word-row .pos { font-size: 13px; font-style: italic; color: var(--muted); }
.word-row .meaning { font-size: 16px; }
.word-row .ex { font-size: 15px; color: var(--muted); font-style: italic; }
mark { background: var(--pencil-soft); color: var(--pencil); font-style: normal; font-weight: 700; border-radius: 3px; padding: 0 2px; }
.status { display: inline-block; padding: 1px 8px; border-radius: 99px; font-size: 12px; font-weight: 700; background: var(--sunk); color: var(--muted); }
.status.learning { background: var(--pencil-soft); color: var(--pencil); }
.status.mastered { background: var(--ok-soft); color: var(--ok); }
.wotd { display: grid; gap: 8px; padding: 18px; border-radius: var(--radius); background: var(--surface); border: 1px solid var(--line); }
.wotd .lemma { font-family: var(--font-display); font-size: 30px; font-weight: 800; letter-spacing: -0.02em; }
.big-word { font-family: var(--font-display); font-size: clamp(30px, 8vw, 40px); font-weight: 800; letter-spacing: -0.02em; }
.hint { font-size: 15px; color: var(--muted); }
.wfb { display: grid; gap: 6px; }
input.answer-line { width: 100%; min-height: 56px; padding: 12px 16px; border-radius: 14px; border: 2px solid var(--line); background: var(--surface); font-size: 22px; font-family: var(--font-body); }
input.answer-line:focus { outline: none; border-color: var(--pencil); }

/* ---------- guide ---------- */
.flow { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; counter-reset: flow; }
.flow li { position: relative; display: grid; grid-template-columns: 40px minmax(0, 1fr); gap: 4px 14px; padding-bottom: 22px; }
.flow li::before { counter-increment: flow; content: counter(flow); grid-row: span 2; width: 40px; height: 40px; display: grid; place-items: center; border-radius: 50%; background: var(--pencil); color: var(--pencil-ink); font-family: var(--font-display); font-weight: 800; font-size: 18px; }
.flow li::after { content: ""; position: absolute; left: 19px; top: 44px; bottom: 4px; width: 2px; background: var(--pencil-line); }
.flow li:last-child::after { display: none; }
.flow h3 { font-size: 18px; padding-top: 8px; }
.flow p { grid-column: 2; color: var(--muted); }
.guide-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
.guide-grid > div { display: grid; gap: 4px; align-content: start; padding: 14px 16px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); }
.guide-grid b { font-family: var(--font-display); font-size: 17px; }

  const MIN = 60e3, DAY = 864e5;

  const MASTERED = 5;
  const SEV_WEIGHT = { error: 3, unnatural: 2, style: 1, typo: 1 };

  const WORD_KINDS = {
    spelling: { title: "Mistyped", long: "Words you mistype", blurb: "Words you often type wrong. Typing them correctly a few times is what fixes the habit." },
    know: { title: "To know", long: "Words to know", blurb: "Words you used in the wrong form, or needed but didn't have. Learn what each one means and where it fits." },
    clearer: { title: "Clearer", long: "Words that say it clearer", blurb: "Words and phrases that make your point sharper than what you wrote." },

  const pad = (n) => String(n).padStart(2, "0");
  const dayKey = (t = Date.now()) => { const d = new Date(t); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
  const fmtDay = (ts) => ts ? new Date(ts).toLocaleDateString(undefined, { weekday: "short", day: "numeric", month: "short" }) : "";

  const plural = (n, one, many) => `${n} ${n === 1 ? one : (many || one + "s")}`;
  const squash = (t) => String(t || "").replace(/\s+/g, " ").trim();
  const norm = (t) => squash(String(t || "").replace(/[’‘]/g, "'").replace(/[“”]/g, '"')).replace(/^[.!?,;:]+|[.!?,;:]+$/g, "").trim().toLowerCase();
  const answerKey = (t) => squash(String(t || "").replace(/[’‘]/g, "'").replace(/[“”]/g, '"')).replace(/[.!?]+$/g, "").trim();

  function hashStr(str) { let x = 2166136261; for (let i = 0; i < str.length; i++) { x ^= str.charCodeAt(i); x = Math.imul(x, 16777619); } return x >>> 0; }

    let a = hashStr(String(seed)) || 1;
    const rand = () => { a |= 0; a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };

  }
  function readLocal(key, fallback) { try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; } catch (e) { return fallback; } }
  function writeLocal(key, value) { try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) { /* storage unavailable */ } }

  async function sha1Hex(text) {
    try {
      const buf = await crypto.subtle.digest("SHA-1", new TextEncoder().encode(text));

  }
  async function cardId(pattern, wrong, right) {
    let w = norm(wrong), r = norm(right);
    if (w === r) { w = squash(wrong); r = squash(right); }

  // ===================================================================== word diff (proofreading marks)
  function tokens(t) { return String(t || "").match(/\s+|[\p{L}\p{N}'’_-]+|[^\s\p{L}\p{N}]/gu) || []; }
  function diffParts(a, b) {
    const A = tokens(a), B = tokens(b), n = A.length, m = B.length;

  // Vocabulary: the same word of the same kind is one word card, however many messages it came from.
  function deriveWords(batches) {
    const words = new Map();
    for (const b of batches) {
      for (const v of b.vocab || []) {
        if (!v || !v.id || !v.word || !WORD_KINDS[v.kind]) continue;
        let w = words.get(v.id);
        if (!w) {
          w = { id: v.id, isWord: true, kind: v.kind, word: v.word, pos: v.pos || "", meaning: v.meaning || "", meaning_zh: v.meaning_zh || "", example: v.example || "", wrote: [], distractors: [], first: v.ts, last: v.ts, times: 0 };
          words.set(v.id, w);
        }
        w.times++;
        if (v.you_wrote && !w.wrote.includes(v.you_wrote)) w.wrote.push(v.you_wrote);
        for (const d of v.distractors || []) if (d && !w.distractors.includes(d)) w.distractors.push(d);
        if ((v.ts || "") >= (w.last || "")) {
          w.last = v.ts;
          if (v.example) w.example = v.example;
          if (v.meaning) { w.meaning = v.meaning; w.meaning_zh = v.meaning_zh || w.meaning_zh; }
        }
      }
    }
    // a misspelling counts every time the user typed it, not once per batch
    const typos = {};
    for (const c of S.cards) if (c.pattern === "spelling" || c.pattern === "apostrophes") typos[norm(c.right)] = (typos[norm(c.right)] || 0) + c.examples.length;
    for (const w of words.values()) if (w.kind === "spelling") w.times = Math.max(w.times, typos[norm(w.word)] || 0);
    S.words = [...words.values()];
    S.wordById = words;
  }

  function mergeProgress() {
    const srs = {};
    let stats = { days: {}, rounds: 0 };
    for (const [id, data] of S.progressDocs) {
      if (id.startsWith("srs-")) Object.assign(srs, (data && data.cards) || {});
      else if (id === "stats" && data) stats = { days: Object.assign({}, data.days || {}), rounds: data.rounds || 0 };
    }
    for (const [cid, st] of Object.entries(S.srsLocal)) if (!srs[cid] || (st.t || 0) >= (srs[cid].t || 0)) srs[cid] = st;
    for (const [day, rec] of Object.entries(S.stats.days || {})) if (!stats.days[day] || (rec.a || 0) > (stats.days[day].a || 0)) stats.days[day] = rec;
    stats.rounds = Math.max(stats.rounds || 0, S.stats.rounds || 0);
    S.srs = srs;
    S.stats = stats;
  }

  // ===================================================================== spaced repetition
  const stateOf = (c) => S.srs[c.id];
  const isDue = (c, now = Date.now()) => { const st = stateOf(c); return !!st && (st.d || 0) <= now; };
  const dueCards = () => S.cards.filter((c) => isDue(c));
  const freshCards = () => S.cards.filter((c) => !stateOf(c));
  const dueWords = () => S.words.filter((w) => isDue(w));
  function wordStatus(w) {
    const st = stateOf(w);
    return !st ? ["new", "New"] : st.b >= MASTERED ? ["mastered", "Mastered"] : ["learning", "Learning"];
  }
  // `text` with the first case-insensitive match of `word` highlighted
  function markWord(text, word) {
    const at = String(text).toLowerCase().indexOf(String(word).toLowerCase());
    if (!word || at < 0) return h("span", null, text);
    return h("span", null, text.slice(0, at), h("mark", null, text.slice(at, at + word.length)), text.slice(at + word.length));
  }
  function newSeenToday() { const today = dayKey(); return Object.values(S.srs).filter((st) => st.f && dayKey(st.f) === today).length; }
  const newLeftToday = () => Math.max(0, settings.perDay - newSeenToday());
  function priority(c) {
    const days = c.last ? (Date.now() - Date.parse(c.last)) / DAY : 99;
    return (SEV_WEIGHT[c.severity] || 1) * (1 + Math.log2(1 + (c.times || 1))) + Math.max(0, 3 - days / 7);
  }
  function grade(card, correct) {
    const now = Date.now();
    const prev = stateOf(card) || { b: 0, n: 0, r: 0, w: 0, f: now };
    const st = Object.assign({}, prev);
    st.n = (st.n || 0) + 1;
    if (correct) { st.r = (st.r || 0) + 1; st.b = Math.min((st.b || 0) + 1, INTERVALS.length - 1); st.d = now + INTERVALS[st.b]; }
    else { st.w = (st.w || 0) + 1; st.b = 1; st.d = now + INTERVALS[1]; st.l = (st.l || 0) + 1; }
    st.t = now;
    if (!st.f) st.f = now;
    S.srsLocal[card.id] = st;
    S.srs[card.id] = st;
    queuePatch("srs-" + card.id.charAt(0), { cards: { [card.id]: st } });
  }
  function patternMastery(key) {
    const cs = S.cards.filter((c) => c.pattern === key);
    let m = 0, l = 0;
    for (const c of cs) { const st = stateOf(c); if (st && st.b >= MASTERED) m++; else if (st) l++; }
    return { total: cs.length, mastered: m, learning: l, fresh: cs.length - m - l };
  }

  // ===================================================================== database
  const pendingPatches = new Map();
  const writing = new Set();
  function deepMerge(a, b) {
    const out = Object.assign({}, a);
    for (const [k, v] of Object.entries(b)) out[k] = v && typeof v === "object" && !Array.isArray(v) && a && typeof a[k] === "object" && a[k] ? deepMerge(a[k], v) : v;
    return out;
  }
  function queuePatch(docId, patch) {
    if (S.mode === "example") { const local = readLocal("bp-example-progress", {}); local[docId] = deepMerge(local[docId] || {}, patch); writeLocal("bp-example-progress", local); return; }
    if (!S.db || !S.canWrite) return;
    pendingPatches.set(docId, deepMerge(pendingPatches.get(docId) || {}, patch));
    flush(docId);
  }
  async function flush(docId) {
    if (writing.has(docId) || !pendingPatches.has(docId)) return;
    const patch = pendingPatches.get(docId);
    pendingPatches.delete(docId);
    writing.add(docId);
    try {
      const ref = S.db.doc("progress/" + docId);
      if (S.progressDocs.has(docId)) await ref.update(patch);
      else {
        const snap = await ref.get();
        if (snap.exists) await ref.update(patch); else await ref.set(patch);
      }
    } catch (e) {
      if (e && (e.code === "invalid_argument" || e.code === "not_granted" || e.code === "revoked")) {
        S.canWrite = false;
        showNotice("Your answers can't be saved here, so progress stays on this screen only.");
      } else if (e && e.code === "quota_exceeded") {
        showNotice("The app's storage is full, so new progress isn't being saved.");
      } else {
        pendingPatches.set(docId, deepMerge(patch, pendingPatches.get(docId) || {}));
        setTimeout(() => flush(docId), 4000 + Math.random() * 3000);
      }
    } finally {
      writing.delete(docId);
      if (pendingPatches.has(docId)) setTimeout(() => flush(docId), 0);
    }
  }
  function saveStats() {
    const today = dayKey();
    queuePatch("stats", { days: { [today]: S.stats.days[today] }, rounds: S.stats.rounds });
  }

  function showNotice(text) { const n = $("#notice"); n.textContent = text; n.hidden = !text; }

  async function connect() {
    const claude = window.claude;
    const db = claude && typeof claude.use === "function" ? await claude.use("db").catch(() => null) : null;
    if (!db) return startExample();
    S.db = db;
    S.mode = "live";
    const user = await claude.use("user").catch(() => null);
    if (user) {
      const owner = await user.isOwner();
      const can = await user.can("data.write");
      S.canWrite = owner || can === true || can === null;
    } else S.canWrite = true;
    claude.use("sample").then((fn) => { S.sample = fn || null; requestRender(); }).catch(() => {});
    const onErr = (e) => { if (e && e.code !== "unavailable") showNotice("The connection to your lessons was lost. Reload the page to reconnect."); };
    db.collection("lessons").onSnapshot((snap) => {
      S.batches = new Map(snap.docs.filter((d) => d.exists).map((d) => [d.id, d.data()]));
      S.loaded.lessons = true; derive(); mergeProgress(); requestRender();
    }, onErr);
    db.collection("catalog").onSnapshot((snap) => {
      const doc = snap.docs.find((d) => d.id === "patterns");
      S.baseCatalog = doc ? doc.data() : null; derive(); requestRender();
    }, onErr);
    db.collection("progress").onSnapshot((snap) => {
      S.progressDocs = new Map(snap.docs.filter((d) => d.exists).map((d) => [d.id, d.data()]));
      S.loaded.progress = true; mergeProgress(); requestRender();
    }, onErr);
    if (!S.canWrite) showNotice("You can practise here, but only the owner's answers are saved.");
  }

  function startExample() {
    S.mode = "example";
    S.canWrite = true;
    S.baseCatalog = EXAMPLE.catalog;
    S.batches = new Map(EXAMPLE.batches.map((b) => [b.id, b]));
    S.progressDocs = new Map(Object.entries(readLocal("bp-example-progress", {})));
    S.loaded.lessons = S.loaded.progress = true;
    derive(); mergeProgress();
    showNotice("These are example lessons. Open Blue Pencil from claude.ai to see the lessons made from your own messages.");
    requestRender();
  }

  // ===================================================================== routing and rendering
  const TABS = [["today", "Today"], ["patterns", "Patterns"], ["words", "Words"], ["messages", "Messages"], ["write", "Write"], ["progress", "Progress"]];
  function route() {
    const hash = (location.hash || "").replace(/^#/, "");
    const m = hash.match(/^pattern-([a-z0-9-]+)$/);
    if (m) { S.view = "pattern"; S.param = m[1]; }
    else if (hash === "guide" || TABS.some(([k]) => k === hash)) { S.view = hash; S.param = null; }
    else { S.view = "today"; S.param = null; }
    render(true);
  }
  function go(hash) { if (location.hash === "#" + hash) route(); else location.hash = hash; }

  let renderQueued = false, renderDeferred = false;
  function requestRender() {
    if (renderQueued) return;
    renderQueued = true;
    requestAnimationFrame(() => { renderQueued = false; render(false); });
  }
  function render(navigated) {
    const view = $("#view");
    const active = document.activeElement;
    if (!navigated && active && view.contains(active) && /^(TEXTAREA|INPUT|SELECT)$/.test(active.tagName)) { renderDeferred = true; return; }
    renderDeferred = false;
    renderTabs();
    renderBar();
    const builders = { today: viewToday, patterns: viewPatterns, pattern: viewPattern, words: viewWords, messages: viewMessages, write: viewWrite, progress: viewProgress, guide: viewGuide };
    const scroll = window.scrollY;
    view.replaceChildren(S.mode === "loading" ? viewLoading() : (builders[S.view] || viewToday)());
    if (navigated) { window.scrollTo(0, 0); view.focus({ preventScroll: true }); } else window.scrollTo(0, scroll);
  }
  document.addEventListener("focusout", () => { if (renderDeferred) setTimeout(() => { if (renderDeferred) render(false); }, 0); });

  function renderTabs() {
    const nav = $("#tabs");
    const current = S.view === "pattern" ? "patterns" : S.view;
    nav.replaceChildren(...TABS.map(([key, label]) => h("a", { href: "#" + key, "aria-current": key === current ? "page" : null }, icon(key), label)));
    const guideBtn = $("#guide-btn");
    if (guideBtn) guideBtn.setAttribute("aria-current", S.view === "guide" ? "page" : "false");
  }
  function renderBar() {
    const meta = $("#bar-meta");
    const streak = streakDays();

    meta.replaceChildren(...[
      streak ? h("span", { class: "streak", title: "Days in a row with practice" }, icon("flame"), String(streak)) : null,
      S.cards.length ? h("span", { class: "num" }, due ? `${due} due` : `${S.cards.length} cards`) : null,
    ].filter(Boolean));
  }

  function viewLoading() {
    return h("div", { class: "stack" }, h("div", { class: "hero" }, h("p", { class: "eyebrow" }, "Blue Pencil"), h("h1", { class: "display" }, "Loading your lessons"), h("div", { class: "row muted" }, h("span", { class: "spinner", "aria-hidden": "true" }), "Opening your lessons…")));
  }

  function emptyState() {

      h("p", { class: "sub" }, "Your first lessons are on their way"),

      S.sample ? h("p", { class: "muted" }, "You can also start now: write a message in the Write tab and check it.") : null,

  // ---------- Today ----------
  function greeting() {
    const hr = new Date().getHours();

  }
  function streakDays() {
    const days = S.stats.days || {};
    let n = 0;
    let t = Date.now();
    if (!(days[dayKey(t)] && days[dayKey(t)].a)) t -= DAY;
    while (days[dayKey(t)] && days[dayKey(t)].a) { n++; t -= DAY; }
    return n;
  }
  function viewToday() {
    if (!S.cards.length) return h("div", { class: "stack" }, welcomeCard(), h("div", { class: "hero" }, h("p", { class: "eyebrow" }, greeting()), h("h1", { class: "display" }, "Practice while Claude works")), emptyState());
    const due = dueCards().length;
    const fresh = Math.min(freshCards().length, newLeftToday());
    const today = S.stats.days[dayKey()] || { a: 0, c: 0 };
    const headline = due ? `${plural(due, "card")} ready to review` : fresh ? `${plural(fresh, "new card")} for today` : "You're up to date";
    const blurb = due || fresh
      ? `A round is ${settings.round} cards, about two minutes. Every card comes from a mistake in your own messages.`
      : "Nothing is due. A bonus round brings back the cards you're still learning.";
    return h("div", { class: "stack" },
      welcomeCard(),
      h("section", { class: "hero" },
        h("p", { class: "eyebrow" }, `${greeting()} · ${fmtDay(Date.now())}`),
        h("h1", { class: "display" }, headline),
        h("p", { class: "lede" }, blurb),
        h("div", { class: "row" },
          h("button", { class: "btn primary big", type: "button", onclick: () => startRound({}) }, icon("play"), due || fresh ? "Start a round" : "Bonus round"),
          h("span", { class: "pill" }, h("b", null, String(today.a || 0)), "answered today"),
          today.a ? h("span", { class: "pill" }, h("b", null, `${Math.round(100 * (today.c || 0) / today.a)}%`), "right") : null,
        ),
      ),
      latestChatSection(),
      focusSection(),
      wordOfTheDay(),
      S.sample ? h("section", { class: "stack-sm" },
        h("div", { class: "section-head" }, h("h2", { class: "sub" }, "Before you send"), h("a", { href: "#write" }, "Open Write")),
        h("p", { class: "muted" }, "Paste a message for a colleague or a request to Claude. Blue Pencil checks it, explains each fix, and can add your mistakes to practice."),
      ) : null,
    );
  }
  function welcomeCard() {
    if (readLocal("bp-guide-seen", false)) return null;
    return h("section", { class: "welcome" },
      h("p", { class: "sub" }, "New to Blue Pencil?"),
      h("p", null, "Take two minutes to see where your lessons come from, how a round works, and how to use it on your other account."),
      h("div", { class: "row" },
        h("a", { class: "btn primary", href: "#guide" }, icon("help"), "How it works"),
        h("button", { class: "btn quiet", type: "button", onclick: () => { writeLocal("bp-guide-seen", true); render(false); } }, "Hide this"),
      ),
    );
  }
  function wordOfTheDay() {
    if (!S.words.length) return null;
    const pool = S.words.filter((w) => w.kind !== "spelling" && !((stateOf(w) || {}).b >= MASTERED));
    const list = pool.length ? pool : S.words;
    const w = list.slice().sort((a, b) => a.id.localeCompare(b.id))[hashStr(dayKey()) % list.length];
    const due = dueWords().length;
    return h("section", { class: "stack-sm" },
      h("div", { class: "section-head" }, h("h2", { class: "sub" }, "Word of the day"), h("a", { href: "#words" }, "All words")),
      h("div", { class: "wotd" },
        h("div", { class: "row" }, h("span", { class: "lemma" }, w.word), w.pos ? h("span", { class: "muted small" }, w.pos) : null),
        h("p", null, w.meaning),

        w.example ? h("p", { class: "muted" }, markWord(w.example, w.word)) : null,
        w.wrote.length ? h("p", { class: "small muted" }, "You wrote ", h("del", { class: "x" }, w.wrote[0])) : null,
        h("div", { class: "row" }, h("button", { class: "btn", type: "button", onclick: () => startWordRound({}) }, icon("play"), due ? `Word round (${due} due)` : "Word round")),
      ),
    );
  }
  function latestChatSection() {
    const latest = S.messages.find((m) => m.source === "claude-code" || m.source === "example");
    if (!latest) return null;
    const sameDay = S.messages.filter((m) => dayKey(m.ts) === dayKey(latest.ts));
    const cards = new Map();
    for (const m of sameDay) for (const c of S.findingsByMsg.get(m.id) || []) cards.set(c.id, c);
    const counts = {};
    for (const c of cards.values()) counts[c.pattern] = (counts[c.pattern] || 0) + 1;
    const top = Object.entries(counts).sort((a, b) => b[1] - a[1]).slice(0, 3);

      h("div", { class: "section-head" }, h("h2", { class: "sub" }, `From your chats on ${fmtDay(latest.ts)}`), h("a", { href: "#messages" }, "All messages")),
      h("p", { class: "muted" }, `${plural(sameDay.length, "message")}, ${plural(cards.size, "thing")} to learn${top.length ? ": " : "."}`, top.map(([k, n], i) => [i ? ", " : "", h("a", { class: "link", href: "#pattern-" + k }, patternTitle(k)), ` (${n})`])),
      sample ? h("div", { class: "panel stack-sm" }, h("p", { class: "eyebrow" }, "You wrote"), proof(sample.text, sample.fixed, "proof")) : null,
    );
  }
  function focusSection() {
    const weekAgo = Date.now() - 14 * DAY;
    const counts = {};
    for (const c of S.cards) {
      if (c.severity === "typo" || c.severity === "style") continue;

      h("p", { class: "eyebrow" }, "Your focus this week"),

    );
  }

  // ---------- Patterns ----------
  function patternTitle(key) { return (S.patterns[key] && S.patterns[key].title) || key.replace(/-/g, " "); }
  function masteryBar(mx) {
    const pct = (n) => mx.total ? (100 * n / mx.total).toFixed(1) + "%" : "0";

    }

      h("div", { class: "hero" },
        h("h1", { class: "display" }, "Patterns"),
        h("p", { class: "lede" }, "The kinds of mistakes in your writing, most frequent first. Green is mastered, blue is still being learned."),
      ),
      cats.map((cat) => h("section", { class: "cat" },
        h("div", { class: "section-head" }, h("h2", null, (S.categories[cat] || {}).title || cat), settings.zh && (S.categories[cat] || {}).zh ? h("span", { class: "zh" }, S.categories[cat].zh) : null),
        h("div", null, byCat[cat].sort((a, b) => b.times - a.times).map((row) => {

            h("span", { class: "bar-wrap" }, masteryBar(mx), h("span", { class: "num" }, `${mx.mastered}/${mx.total}`)),
          );
        })),
      )),

  }
  function viewPattern() {

    if (!p && !cs.length) return h("div", { class: "stack" }, h("a", { class: "link", href: "#patterns" }, "‹ Patterns"), h("p", null, "This pattern isn't in your lessons."));
    const mx = patternMastery(key);
    const cat = S.categories[(p || {}).category] || {};
    return h("div", { class: "stack" },
      h("a", { class: "link", href: "#patterns" }, "‹ All patterns"),
      h("div", { class: "hero" },
        h("p", { class: "eyebrow" }, cat.title || "Pattern"),
        h("h1", { class: "display" }, patternTitle(key)),

    const c = it.card;
    const p = S.patterns[c.pattern] || {};
    return h("div", { class: "feedback " + (ok ? "good" : "bad"), role: "status", "aria-live": "polite" },
      h("div", { class: "verdict" }, icon(ok ? "check" : "cross"), ok ? "Right" : "Not quite"),
      extra || null,
      h("div", { class: "proof" }, proof(it.ex.sentence, it.ex.corrected, "")),
      h("p", null, c.explain || p.rule || ""),
      settings.zh && (c.explain_zh || p.rule_zh) ? h("p", { class: "zh" }, c.explain_zh || p.rule_zh) : null,
      h("p", { class: "muted small" }, `${p.title || c.pattern}${c.times > 1 ? ` · you wrote this ${c.times} times` : ""}${c.last && c.source !== "generated" ? ` · ${fmtShort(c.last)}` : ""}`),
    );
  }
  function answer(it, ok) {
    if (R.state) return;
    R.state = { ok };
    R.answered++;
    if (ok) R.correct++;
    R.results.push({ card: it.card, ok });
    if (it.card.source !== "generated") grade(it.card, ok);
  }

  function renderLearn(it, body, inner) {
    const p = S.patterns[it.card.pattern] || {};
    const examples = S.cards.filter((c) => c.pattern === it.card.pattern).slice(0, 3).map((c) => c.examples[c.examples.length - 1]);
    body.append(
      kindLabel("New pattern"),
      h("h2", { class: "p-prompt" }, p.title || it.card.pattern),
      h("div", { class: "lesson" },
        h("p", { class: "rule" }, p.rule || ""),
        settings.zh && p.rule_zh ? h("p", { class: "zh" }, p.rule_zh) : null,
        h("p", { class: "eyebrow" }, "From your messages"),
        h("div", { class: "list" }, examples.map((ex) => h("div", { class: "proof" }, proof(ex.sentence, ex.corrected, "")))),
      ),
    );
    inner.append(h("button", { class: "btn primary big", type: "button", "data-autofocus": "", onclick: next }, "Got it", icon("arrow")));
  }

  function renderChoose(it, body, inner) {
    const ex = it.ex;
    const at = ex.sentence.indexOf(ex.wrong);
    const before = ex.sentence.slice(0, at), after = ex.sentence.slice(at + ex.wrong.length);
    const opts = shuffled(optionsFor(it.card, ex), it.card.id + R.i + R.start);
    const sentence = h("p", { class: "p-sentence" }, before, h("span", { class: "blank" }, "____"), after);
    const feedback = h("div");
    const buttons = opts.map((o, i) => h("button", { class: "option", type: "button", "data-opt": o, onclick: () => pick(o) }, h("span", { class: "key" }, String(i + 1)), o));
    body.append(kindLabel(it.kind === "gen" ? "New sentence" : "Choose the right words"), sentence, h("div", { class: "options" }, buttons), feedback);
    inner.append(h("span", { class: "muted small" }, coarse ? "Tap an answer" : "Press 1 to 4, or click"));
    function pick(o) {
      if (R.state) return;
      const ok = o === squash(ex.right);
      answer(it, ok);
      for (const b of buttons) {
        b.disabled = true;
        if (b.dataset.opt === squash(ex.right)) b.classList.add("right");
        else if (b.dataset.opt === o) b.classList.add("wrong");
      }
      sentence.replaceChildren(before, h(ok ? "ins" : "ins", { class: "x" }, ex.right), after);
      feedback.replaceChildren(feedbackBox(ok, it, ok ? null : h("p", null, "You chose ", h("del", { class: "x" }, o), ". The right words are ", h("ins", { class: "x" }, ex.right), ".")));
      nextButton(inner);
    }
    it.onKey = (key) => { const n = Number(key); if (n >= 1 && n <= buttons.length && !R.state) pick(buttons[n - 1].dataset.opt); };
  }

  function renderSpot(it, body, inner) {
    const spot = spotTargets(it.ex);
    const feedback = h("div");
    const buttons = spot.words.map((w, i) => h("button", { class: "word", type: "button", onclick: () => tap(i) }, w.text));
    body.append(kindLabel("Find the mistake"), h("p", { class: "p-prompt" }, "Tap the word that's wrong."), h("div", { class: "words" }, buttons), feedback);
    inner.append(h("button", { class: "btn", type: "button", onclick: () => tap(-1) }, "I don't see it"));
    function tap(i) {
      if (R.state) return;
      const ok = spot.targets.includes(i);
      answer(it, ok);
      buttons.forEach((b, k) => { b.disabled = true; if (spot.targets.includes(k)) b.classList.add("target"); else if (k === i) b.classList.add("missed"); });
      feedback.replaceChildren(feedbackBox(ok, it));
      nextButton(inner);
    }
  }

  function renderFix(it, body, inner) {
    const ex = it.ex;
    const area = h("textarea", { class: "answer", id: "fix-answer", "aria-label": "Your corrected sentence", value: ex.sentence, spellcheck: "false", "data-autofocus": "" });
    const feedback = h("div");
    body.append(kindLabel("Fix it"), h("p", { class: "p-prompt" }, "This sentence has one mistake. Correct it."), h("p", { class: "quote" }, ex.sentence), area, feedback);
    const check = h("button", { class: "btn primary big", type: "button", onclick: () => submit() }, "Check");
    const giveUp = h("button", { class: "btn", type: "button", onclick: () => finish(false, null) }, "Show me");
    inner.append(giveUp, check);
    area.addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); submit(); } });
    async function submit() {
      if (R.state || check.disabled) return;
      const mine = area.value;
      if (answerKey(mine) === answerKey(ex.corrected)) return finish(true, null);
      if (answerKey(mine) === answerKey(ex.sentence)) return finish(false, h("p", null, "Nothing was changed. The mistake is still there."));
      if (S.sample) {
        check.disabled = true; giveUp.disabled = true;
        feedback.replaceChildren(h("div", { class: "row muted", role: "status" }, h("span", { class: "spinner", "aria-hidden": "true" }), "Checking your answer…"));
        try {
          const p = S.patterns[it.card.pattern] || {};
          const out = await S.sample.json([
            "An English learner was given a sentence with one mistake and asked to correct it.",
            `Sentence: "${ex.sentence}"`, `The mistake: "${ex.wrong}" should be "${ex.right}" (${p.title || it.card.pattern}).`, `Learner's answer: "${mine}"`,
            "Is the answer correct, natural English that fixes this mistake without adding a new one? Small punctuation or capital-letter differences are fine; other good fixes are fine too.",
            'Reply with only JSON: {"ok": true or false, "note": "one short sentence to the learner"}',
          ].join("\n"), { modelTier: "quick" });
          finish(!!(out && out.ok), out && out.note ? h("p", null, String(out.note)) : null, mine);
        } catch (e) {
          if (e && e.code === "cancelled") return;
          selfGrade(mine);
        }
      } else selfGrade(mine);
    }
    function selfGrade(mine) {
      check.disabled = true; giveUp.disabled = true;
      feedback.replaceChildren(h("div", { class: "feedback" }, h("p", { class: "eyebrow" }, "Compare"), h("p", null, "Yours: ", proof(ex.sentence, mine, "")), h("p", null, "Expected: ", proof(ex.sentence, ex.corrected, ""))));
      inner.replaceChildren(
        h("button", { class: "btn", type: "button", onclick: () => finish(false, null, mine) }, "I missed it"),
        h("button", { class: "btn primary big", type: "button", "data-autofocus": "", onclick: () => finish(true, null, mine) }, "Mine is right"),
      );
    }
    function finish(ok, note, mine) {
      if (R.state) return;
      answer(it, ok);
      area.disabled = true;
      const extra = [note, mine != null && !ok ? h("p", null, "You wrote: ", proof(ex.sentence, mine, "")) : null].filter(Boolean);
      feedback.replaceChildren(feedbackBox(ok, it, extra.length ? h("div", { class: "stack-sm" }, extra) : null));
      nextButton(inner);
    }
  }

  function startRewrite(m) {
    const card = { id: "rw-" + m.id, pattern: "clear-feedback", source: "generated", examples: [], explain: "" };
    openRound([{ kind: "rewrite", card, msg: m, ex: { sentence: m.text, corrected: m.polished } }], "Rewrite");
  }
  function renderRewrite(it, body, inner) {
    const m = it.msg;
    const area = h("textarea", { class: "answer", "aria-label": "Your rewrite", value: m.text, "data-autofocus": "", style: "min-height:160px" });
    const feedback = h("div");
    body.append(kindLabel("Rewrite"), h("p", { class: "p-prompt" }, "Rewrite your message the way you'd send it to a colleague."), h("p", { class: "quote" }, m.text), area, feedback);
    const btn = h("button", { class: "btn primary big", type: "button", onclick: () => submit() }, S.sample ? "Get feedback" : "Compare");
    inner.append(btn);
    async function submit() {
      if (R.state) return;
      const mine = area.value.trim();
      if (!mine) return;
      btn.disabled = true;
      R.state = { ok: true };
      R.answered++; R.correct++;
      if (!S.sample) { show(null); return; }
      feedback.replaceChildren(h("div", { class: "row muted", role: "status" }, h("span", { class: "spinner", "aria-hidden": "true" }), "Reading your rewrite…"));
      try {
        const out = await S.sample.json([
          "You coach an English learner (software engineer, Mandarin and Singlish background) on workplace writing.",
          `Their original message: """${m.text}"""`, `Their rewrite: """${mine}"""`, `A good version for reference: """${m.polished}"""`,
          "Judge the rewrite. Leave code and technical terms alone. Be encouraging and specific.",
          'Reply with only JSON: {"score": 1 to 5, "good": "one sentence on what improved", "fixes": [{"wrong": "words in the rewrite", "right": "better words", "why": "at most 15 words"}], "better": "their rewrite with the remaining fixes applied"}',
        ].join("\n"), { modelTier: "default", cache: false });
        show(out);
      } catch (e) { show(null, sampleErrorText(e)); }
    }
    function show(out, err) {
      area.disabled = true;
      const fixes = out && Array.isArray(out.fixes) ? out.fixes.slice(0, 6) : [];
      feedback.replaceChildren(h("div", { class: "feedback good" },
        out ? h("div", { class: "verdict" }, icon("check"), `${Math.max(1, Math.min(5, Number(out.score) || 3))} / 5`) : h("div", { class: "verdict" }, "Compare"),
        err ? h("p", { class: "muted" }, err) : null,
        out && out.good ? h("p", null, String(out.good)) : null,
        fixes.length ? h("div", { class: "list" }, fixes.map((f) => h("div", null, h("del", { class: "x" }, String(f.wrong || "")), " ", h("ins", { class: "x" }, String(f.right || "")), h("p", { class: "muted small" }, String(f.why || ""))))) : null,
        h("p", { class: "eyebrow" }, out && out.better ? "Your version, polished" : "A natural version"),
        h("div", { class: "polished" }, String((out && out.better) || m.polished)),
      ));
      nextButton(inner, "Finish");
    }
  }

  async function generateRound(key, btn) {
    if (!S.sample) return;
    const p = S.patterns[key] || {};
    const mine = S.cards.filter((c) => c.pattern === key).slice(0, 6).map((c) => `"${c.wrong}" → "${c.right}"`).join("; ");
    const old = btn.textContent;
    btn.disabled = true; btn.lastChild.textContent = "Writing sentences…";
    try {
      const out = await S.sample.json([
        `Write 6 new practice sentences for an English learner (software engineer, workplace and coding topics) on this pattern: "${p.title || key}". Rule: ${p.rule || ""}`,
        `Their own past mistakes on it: ${mine || "none yet"}.`,
        "Each sentence: natural workplace English, at most 20 words, containing exactly ONE mistake of this pattern and no other mistake.",
        'Reply with only a JSON array of {"sentence": "...", "wrong": "exact words in the sentence that are wrong", "right": "the fix", "explain": "at most 20 simple words", "explain_zh": "Simplified Chinese, at most 30 characters", "distractors": ["two other wrong versions"]}',
      ].join("\n"), { modelTier: "default", cache: false });
      const items = (Array.isArray(out) ? out : []).filter((x) => x && x.sentence && x.wrong && x.right && String(x.sentence).includes(x.wrong)).slice(0, 6).map((x, i) => {
        const card = { id: `gen-${key}-${i}-${Date.now()}`, pattern: key, severity: "error", source: "generated", wrong: x.wrong, right: x.right, explain: String(x.explain || ""), explain_zh: String(x.explain_zh || ""), distractors: (x.distractors || []).map(String), examples: [], times: 0 };
        const ex = { sentence: String(x.sentence), wrong: String(x.wrong), right: String(x.right), corrected: String(x.sentence).replace(x.wrong, x.right) };
        card.examples.push(ex);
        return { card, ex, kind: "gen" };
      });
      if (items.length) openRound(items, `New sentences: ${p.title || key}`);
      else btn.lastChild.textContent = "No sentences came back. Try again";
    } catch (e) {
      btn.lastChild.textContent = sampleErrorText(e) ? "Couldn't write sentences. Try again" : old;
    } finally {
      btn.disabled = false;
    }
  }

  function renderDone(body, inner) {
    recordRound();
    const pct = R.answered ? Math.round(100 * R.correct / R.answered) : 0;
    const missed = R.results.filter((r) => !r.ok).map((r) => r.card);
    const words = R.type === "words";
    const due = words ? dueWords().length : dueCards().length;
    put(body,
      kindLabel(R.label || "Round"),
      h("div", { class: "done-score" }, `${R.correct}/${R.answered}`),
      h("p", { class: "lede" }, pct === 100 ? "Every one right. These come back in a few days." : pct >= 70 ? "Good round. The ones you missed come back in 10 minutes." : "Tough round. The ones you missed come back in 10 minutes, and that repetition is what makes them stick."),
      missed.length ? h("section", { class: "stack-sm" }, h("p", { class: "eyebrow" }, "Look at these again"), h("div", { class: "list" }, missed.map((c) => c.isWord
        ? h("div", null, h("b", null, c.word), c.meaning ? ` · ${c.meaning}` : "")
        : c.examples && c.examples.length ? h("div", { class: "proof" }, proof(c.examples[c.examples.length - 1].sentence, c.examples[c.examples.length - 1].corrected, "")) : null))) : null,
    );
    const again = () => { closeRound(false); if (words) startWordRound({}); else startRound({}); };
    put(inner,
      h("button", { class: "btn", type: "button", onclick: () => closeRound(false) }, "Done"),
      (words ? S.words.length : S.cards.length) ? h("button", { class: "btn primary big", type: "button", "data-autofocus": "", onclick: again }, due ? `Another round (${due} due)` : "Another round") : null,
    );
  }

  document.addEventListener("keydown", (e) => {
    if (!R) { if (e.key === "Escape" && !$("#sheet").hidden) closeSheet(); return; }
    if (e.key === "Escape") { e.preventDefault(); closeRound(true); return; }
    const it = R.items[R.i];
    const typing = /^(TEXTAREA|INPUT)$/.test((document.activeElement || {}).tagName || "");
    if (it && it.onKey && !typing && /^[1-4]$/.test(e.key)) { e.preventDefault(); it.onKey(e.key); }
  });

  // ===================================================================== settings sheet
  function openSheet() {
    const sheet = $("#sheet");
    const toggle = (id, label, hint, key) => h("div", { class: "setting" },
      h("label", { for: id }, h("span", null, label), hint ? h("small", null, hint) : null),
      h("input", { class: "switch", type: "checkbox", id, checked: !!settings[key], onchange: (e) => { settings[key] = e.target.checked; saveSettings(); render(false); } }));
    const choice = (id, label, hint, key, values) => h("div", { class: "setting" },
      h("label", { for: id }, h("span", null, label), hint ? h("small", null, hint) : null),
      h("select", { class: "pick", id, onchange: (e) => { settings[key] = Number(e.target.value); saveSettings(); render(false); } }, values.map((v) => h("option", { value: String(v), selected: settings[key] === v }, String(v)))));
    sheet.replaceChildren(h("div", { class: "sheet-card" },
      h("div", { class: "spread" }, h("h2", { class: "title" }, "Settings"), h("button", { class: "icon-btn", type: "button", "aria-label": "Close settings", onclick: closeSheet }, icon("x"))),
      h("div", null,
        toggle("set-zh", "Chinese hints · 中文提示", "Show a short Simplified Chinese explanation under each rule.", "zh"),
        toggle("set-quick", "Tap-only practice", "No typing in rounds: good on a phone.", "quick"),
        choice("set-round", "Cards per round", null, "round", [5, 8, 12, 16]),
        choice("set-new", "New cards per day", "Reviews are never limited.", "perDay", [6, 12, 20, 30]),
      ),
      h("p", { class: "muted small" }, "These settings are kept on this device. Your answers and progress are saved with your lessons, so they follow you to your phone and iPad."),
    ));
    sheet.hidden = false;
    sheet.onclick = (e) => { if (e.target === sheet) closeSheet(); };
    const first = sheet.querySelector("input, select, button");
    if (first) first.focus();
  }
  function closeSheet() { $("#sheet").hidden = true; $("#settings-btn").focus(); }
  $("#settings-btn").addEventListener("click", openSheet);

  // ===================================================================== start
  window.addEventListener("hashchange", route);
  let resizeTimer = 0, lastWidth = window.innerWidth;
  window.addEventListener("resize", () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => { if (Math.abs(window.innerWidth - lastWidth) > 40) { lastWidth = window.innerWidth; requestRender(); } }, 250);
  });
  route();
  connect().catch(() => startExample());
})();
</script>
