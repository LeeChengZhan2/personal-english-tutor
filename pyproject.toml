[project]
name = "personal-english-tutor"
version = "0.2.0"
description = "Practise English from the mistakes in your own Claude Code messages"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "anthropic>=1.15.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=8",
]

[project.scripts]
tutor = "server.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# coach/ reads conversations, makes lessons and holds the practice logic; server/ is the web app's API
packages = ["coach", "server"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "realdata: reads the lesson files in data/batches",
    "slow: starts subprocesses",
]
